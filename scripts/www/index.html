<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GBK双向转换工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,SimSun}
body{padding:16px;background:#fff;font-size:16px}
h2{text-align:center;margin-bottom:14px;font-size:18px}
.radio-group{margin-bottom:12px;text-align:center}
.radio-group label{margin:0 8px;font-size:15px;cursor:pointer}
#inputBox{width:100%;padding:10px 8px;font-size:16px;border:1px solid #aaa;border-radius:6px;margin-bottom:10px}
.btn-group{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
button{padding:10px;border:none;border-radius:6px;background:#4078c0;color:#fff;font-size:15px}
button:active{background:#2b5994}
#resultBox{width:100%;min-height:260px;border:1px solid #ddd;padding:10px;white-space:pre-wrap;overflow-y:auto;font-size:15px;background:#fafafa;border-radius:6px}
input[type="file"]{display:none}
</style>
</head>
<body>
<h2>GBK双向转换工具</h2>
<div class="radio-group">
  <label><input type="radio" name="mode" value="gbk2han" checked> GBK→汉字</label>
  <label><input type="radio" name="mode" value="han2gbk"> 汉字→GBK</label>
</div>
<input id="inputBox" type="text" placeholder="输入内容，点转换，支持回车">
<div class="btn-group">
  <button onclick="convert()">转换</button>
  <button onclick="document.getElementById('fileInput').click()">读取TXT</button>
  <button onclick="clearResult()">清空记录</button>
  <button onclick="exportTxt()">导出TXT</button>
</div>
<input type="file" id="fileInput" accept=".txt" onchange="loadTxt(this)">
<div id="resultBox"></div>

<script>
const resultBox = document.getElementById('resultBox');
const inputBox = document.getElementById('inputBox');
const gbkDecoder = new TextDecoder('gbk');

// =====================  GBK 十六进制 → 汉字（稳定原生） =====================
function gbkHexToChar(hexStr){
  try{
    hexStr = hexStr.replace(/\s/g,'');
    if(hexStr.length %2 !==0) return "❌转换失败";
    const arr = [];
    for(let i=0;i<hexStr.length;i+=2){
      arr.push(parseInt(hexStr.substr(i,2),16));
    }
    const u8 = new Uint8Array(arr);
    return gbkDecoder.decode(u8);
  }catch(e){
    return "❌转换失败";
  }
}

// ===================== 汉字 → GBK 十六进制（内置查表，和国标GBK936对齐） =====================
// 来源：GBK 编码映射表，和Python encode("gbk")输出一致
const unicode2gbk = (function(){
  const map = new Map();
  // 常用测试字先预置（国、标、你、好、中、文）
  map.set("国",0xB9FA);
  map.set("标",0xBBAA);
  map.set("你",0xC4E3);
  map.set("好",0xBAC3);
  map.set("中",0xD6D0);
  map.set("文",0xCEC4);

  // 方案：如果想要全部汉字，这里用一个【在线预生成映射】思路；
  // 为了保证 100% 和Python一致，这里用一个非常稳的垫片函数：
  // 原理：利用浏览器的gbk解码反向获取编码（无外部库）
  async function getGbkCode(char){
    const c = char.charCodeAt(0);
    // ASCII 单字节
    if(c < 0x80) return c;
    // 优先查表
    if(map.has(char)) return map.get(char);
    // 反向推导GBK编码（和Python gbk编码结果一致）
    for(let h1=0x81;h1<=0xFE;h1++){
      for(let h2=0x40;h2<=0xFE;h2++){
        if(h2 === 0x7F) continue;
        const buf = new Uint8Array([h1, h2]);
        const s = gbkDecoder.decode(buf);
        if(s === char){
          const code = (h1 << 8) | h2;
          map.set(char, code);
          return code;
        }
      }
    }
    return null;
  }
  return {
    async encodeString(str){
      let out = [];
      for(let ch of str){
        const code = await getGbkCode(ch);
        if(code === null){
          return null;
        }
        if(code < 0x80){
          out.push(code.toString(16).padStart(2,'0'));
        }else{
          out.push(code.toString(16).padStart(4,'0'));
        }
      }
      return out.join('').toUpperCase();
    }
  }
})();

async function charToGBKHex(str){
  const r = await unicode2gbk.encodeString(str);
  if(r === null) return "❌转换失败（该字符不在GBK内）";
  return r;
}

async function convert(){
  const mode = document.querySelector('input[name="mode"]:checked').value;
  const s = inputBox.value.trim();
  if(!s){alert("请输入内容");return;}
  let ret;
  if(mode === "gbk2han"){
    ret = gbkHexToChar(s);
  }else{
    ret = await charToGBKHex(s);
  }
  resultBox.innerText += `${s} → ${ret}\n`;
  resultBox.scrollTop = resultBox.scrollHeight;
}

// 回车触发
inputBox.addEventListener('keydown',e=>{
  if(e.key === "Enter") convert();
})

// 读取txt批量
async function loadTxt(el){
  const f = el.files[0];
  if(!f) return;
  const mode = document.querySelector('input[name="mode"]:checked').value;
  const r = new FileReader();
  r.onload = async ev=>{
    const lines = ev.target.result.split('\n');
    let out = "";
    for(let line of lines){
      const s = line.trim();
      if(!s) continue;
      let res;
      if(mode=="gbk2han") {
        res = gbkHexToChar(s);
      }else{
        res = await charToGBKHex(s);
      }
      out += `${s} → ${res}\n`;
    }
    resultBox.innerText += out;
    resultBox.scrollTop = resultBox.scrollHeight;
  }
  r.readAsText(f);
  el.value = "";
}

function clearResult(){
  resultBox.innerText = "";
}
function exportTxt(){
  const txt = resultBox.innerText;
  if(!txt.trim()){alert("没有结果");return;}
  const blob = new Blob([txt],{type:"text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "gbk转换结果.txt";
  a.click();
  URL.revokeObjectURL(a.href);
}
</script>
</body>
</html>
